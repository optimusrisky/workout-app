name: 設定追加
description: ツール・ライブラリ・インフラ・CI等の設定を追加／変更する
title: "chore: "
body:
  - type: textarea
    id: purpose
    attributes:
      label: 目的
      description: なぜこの設定が必要か。何が困っているか
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 対象・内容
      description: 追加・変更する設定、対象ツール／サービス、依存パッケージ（追加する場合は理由も）
      placeholder: |
        - 対象:
        - 追加する依存:
        - 変更するファイル:
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 検討した選択肢
      description: 他の候補と、これを選んだ理由・トレードオフ
  - type: textarea
    id: acceptance
    attributes:
      label: 完了条件
      placeholder: |
        - [ ]
        - [ ] `pnpm lint` / `pnpm check` / `pnpm build` が通る
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: 影響範囲・リスク
      description: 既存コードへの影響、シークレット・環境変数の扱い、コスト、運用（監視・障害対応）への影響など
  - type: textarea
    id: related
    attributes:
      label: 関連
      description: 関連issue、参考ドキュメントのURLなど
